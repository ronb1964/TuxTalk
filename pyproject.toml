[tool.poetry]
name = "tuxtalk"
version = "0.18.2"
description = "Voice dictation for Linux: hold a key, talk, and your words are typed for you."
authors = ["Ron"]
license = "MIT"
readme = "README.md"
packages = [{ include = "tuxtalk", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"  # Dev: 3.14 (Nobara 42), AppImage: 3.10 (Ubuntu 22.04)
faster-whisper = "*"
# Optional Parakeet engine (parakeet_engine.py). Pure Python; runs on the
# onnxruntime that faster-whisper already pulls in, so it adds only a few MB.
onnx-asr = "^0.12"
# Named here so one lock installs on every supported Python: 1.24+ ships no
# Python 3.10 wheels (the AppImage's), and 1.23 ships none for 3.14 (the dev
# version's). onnx-asr refuses 1.24.1, 1.25.* and 1.26.0, so 3.11+ starts at 1.27.
onnxruntime = [
    { version = "<1.24", python = "<3.11" },
    { version = ">=1.27", python = ">=3.11" },
]
sounddevice = "*"
evdev = "*"
numpy = "*"
pyperclip = "*"
toml = "*"
# "Write numbers as digits" (numbers.py): twenty-five -> 25 in eight languages.
# A small Rust-built wheel (~380 KB) with wheels for every Python we support.
text2num = "^3.1"
# pygobject - using system package (copied manually in build script)
# pycairo - using system package (copied manually in build script)
# NOTE: torch was removed 2026-08-15 — it was never actually used. Inference runs on
# faster-whisper/CTranslate2; GPU uses CTranslate2's CUDA libs (downloaded at runtime by
# cuda_helper.py); model downloads use huggingface_hub. Verified torch-free on CPU and on
# GPU (RTX 4070 SUPER). Removing it cut the packaged size by ~170 MB (.deb 302 MB → 133 MB).

[tool.poetry.scripts]
dictate-tray = "tuxtalk.tray:main"
dictate = "tuxtalk.app:main"
dictate-prefs = "tuxtalk.prefs:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
black = "^25.1.0"
ruff = "0.17.0"  # the version CI lints with
# Reads the bundled emoji font in tests/test_emoji_font.py.
fonttools = "^4.60"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

# What CI enforces. Length, line length, error handling and docstrings are
# measured by tests/test_code_health.py, which lets old code only improve.
[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
