[tool.poetry]
name = "tuxtalk"
version = "0.18.2"
description = "Voice dictation for Linux: hold a key, talk, and your words are typed for you."
authors = ["Ron"]
license = "MIT"
readme = "README.md"
packages = [{ include = "tuxtalk", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"  # Dev: 3.14 (Nobara 42), AppImage: 3.10 (Ubuntu 22.04)
faster-whisper = "*"
# Optional Parakeet engine (parakeet_engine.py). Pure Python; runs on the
# onnxruntime that faster-whisper already pulls in, so it adds only a few MB.
onnx-asr = "^0.12"
# Named here so one lock installs on every supported Python: 1.24+ ships no
# Python 3.10 wheels (the AppImage's), and 1.23 ships none for 3.14 (the dev
# version's). onnx-asr refuses 1.24.1, 1.25.* and 1.26.0, so 3.11+ starts at 1.27.
onnxruntime = [
    { version = "<1.24", python = "<3.11" },
    { version = ">=1.27", python = ">=3.11" },
]
sounddevice = "*"
evdev = "*"
numpy = "*"
pyperclip = "*"
toml = "*"
# "Write numbers as digits" (numbers.py): twenty-five -> 25 in eight languages.
# A small Rust-built wheel (~380 KB) with wheels for every Python we support.
text2num = "^3.1"
# pygobject - using system package (copied manually in build script)
# pycairo - using system package (copied manually in build script)
# NOTE: torch was removed 2026-08-15 — it was never actually used. Inference runs on
# faster-whisper/CTranslate2; GPU uses CTranslate2's CUDA libs (downloaded at runtime by
# cuda_helper.py); model downloads use huggingface_hub. Verified torch-free on CPU and on
# GPU (RTX 4070 SUPER). Removing it cut the packaged size by ~170 MB (.deb 302 MB → 133 MB).

[tool.poetry.scripts]
dictate-tray = "tuxtalk.tray:main"
dictate = "tuxtalk.app:main"
dictate-prefs = "tuxtalk.prefs:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
black = "^25.1.0"
ruff = "0.17.0"  # the version CI lints with
# Reads the bundled emoji font in tests/test_emoji_font.py.
fonttools = "^4.60"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

# What CI enforces: pyflakes, bugbear and simplify. Length, line length, error
# handling and docstrings are measured by tests/test_code_health.py.
[tool.ruff.lint]
select = ["F", "B", "SIM"]
# contextlib.suppress would take a swallowed error out of sight of
# test_code_health.py's except check, so try/except/pass stays as it is.
ignore = ["SIM105"]

# Findings already there when bugbear and simplify were turned on. The list
# may only shrink: tests/test_ruff_ratchet.py fails when an entry is no longer
# needed, so it is struck and the rule holds for that file from then on.
[tool.ruff.lint.per-file-ignores]
"src/tuxtalk/ai_cleanup.py" = ["B905", "SIM109"]
"src/tuxtalk/audio_duck.py" = ["SIM114"]
"src/tuxtalk/config.py" = ["B023"]
"src/tuxtalk/custom_words.py" = ["B905"]
"src/tuxtalk/extension_helper.py" = ["B904"]
"src/tuxtalk/file_transcribe.py" = ["B905"]
"src/tuxtalk/keyboard_layout.py" = ["B905"]
"src/tuxtalk/normalize.py" = ["B905", "SIM905"]
"src/tuxtalk/notes_text.py" = ["SIM102"]
"src/tuxtalk/parakeet_gpu.py" = ["SIM115"]
"src/tuxtalk/pipeline.py" = ["SIM102"]
"src/tuxtalk/recording_indicator.py" = ["SIM108"]
"src/tuxtalk/settings_backup.py" = ["B904", "SIM905"]
"src/tuxtalk/virtual_keyboard.py" = ["B904", "SIM300"]
"src/tuxtalk/vocabulary.py" = ["SIM905"]
"src/tuxtalk/voice_edit_rules.py" = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
