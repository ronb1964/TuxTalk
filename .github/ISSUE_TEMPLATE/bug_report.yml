name: Bug Report
description: Report a problem with TuxTalk
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The more of this you fill in, the faster I can track it down.

  - type: input
    id: distro
    attributes:
      label: Linux Distribution
      description: What Linux distro and version are you using?
      placeholder: "e.g., Ubuntu 24.04, Fedora 41, Arch Linux"
    validations:
      required: true

  - type: dropdown
    id: desktop
    attributes:
      label: Desktop Environment
      description: What desktop environment are you using?
      options:
        - GNOME
        - KDE Plasma
        - COSMIC
        - XFCE
        - Cinnamon
        - MATE
        - Other (please specify in description)
    validations:
      required: true

  - type: dropdown
    id: display
    attributes:
      label: Display Server
      description: Are you using Wayland or X11?
      options:
        - Wayland
        - X11
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TuxTalk Version
      description: Which version are you on? The tray menu's About TuxTalk shows it.
      placeholder: "e.g., 0.15.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: "Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open TuxTalk
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log Output (if applicable)
      description: |
        TuxTalk's Help → Problems → Report a problem gathers your system, settings and log in one go:
        paste that here. Or paste the lines from around the time it happened. The log is at `~/.config/tuxtalk/tuxtalk.log`,
        and `tail -50 ~/.config/tuxtalk/tuxtalk.log` shows the last 50 lines.
        On 0.14.x and earlier it's `~/.config/talktype/talktype.log`.
        For the Flatpak it's `~/.var/app/io.github.ronb1964.TuxTalk/config/tuxtalk/tuxtalk.log`.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might help (screenshots, error messages, etc.)
