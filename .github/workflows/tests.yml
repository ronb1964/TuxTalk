# Runs the test suite on GitHub's servers on every push and pull request, and
# drives the "tests" badge at the top of the README.
#
# Uses Ubuntu's own Python, not actions/setup-python: GTK's Python bindings
# (python3-gi) come from the system and only work with the system Python, the
# same reason the local venv needs the system site-packages.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # 22.04 has Python 3.10, the AppImage's; 24.04 has 3.12. The dev version
    # runs newer still, so a 3.11+ feature only shows up here (tomllib
    # crashed a 0.14.6 test build at startup).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history: a test compares when extension files last changed

      - name: System packages (GTK, D-Bus, a virtual screen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-venv python3-dev python3-gi python3-gi-cairo python3-dbus \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-notify-0.7 libportaudio2 \
            libxkbregistry0 xkb-data \
            xvfb xauth dbus dbus-x11 libxtst6

      # The versions in poetry.lock, the ones the release build installs, so
      # a new release of a dependency can't change a run by itself. Poetry has
      # a venv of its own to keep its dependencies out of the tests'; the tests'
      # venv sees the system's site-packages for python3-gi, and VIRTUAL_ENV
      # points Poetry at it. evdev builds from source, hence python3-dev.
      - name: Python packages (poetry.lock)
        env:
          POETRY_VIRTUALENVS_CREATE: "false"
        run: |
          python3 -m venv poetry-venv
          poetry-venv/bin/pip install -q poetry==2.5.1
          python3 -m venv --system-site-packages venv
          VIRTUAL_ENV="$PWD/venv" poetry-venv/bin/poetry install --no-root --no-interaction

      # A virtual screen for the GTK windows the tests build, and a private
      # D-Bus session bus so no test reaches anything real. The suite uses no
      # pytest plugins, and the venv also sees the runner's own packages: its
      # newer platformdirs announces a pytest plugin that the locked one in
      # front of it doesn't have, and pytest stopped before the first test.
      - name: Run the tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: PYTHONPATH=src xvfb-run -a dbus-run-session --config-file=tests/dbus-session.conf -- venv/bin/python -m pytest tests/ -q

  # Ruff catches undefined names and similar mistakes that only crash when
  # that line finally runs, and likely bugs and needless complication (the
  # rules pyproject.toml selects); shellcheck does the same for the build and
  # release scripts. Neither needs GTK, so this runs separately from the tests.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A venv because Ubuntu's own Python refuses pip installs (PEP 668).
      - name: Install shellcheck and Poetry
        run: |
          python3 -m venv tools-venv
          tools-venv/bin/pip install -q shellcheck-py==0.11.0.1 poetry==2.5.1

      # The release build refuses a stale poetry.lock; this says so on the push
      # that changed pyproject.toml instead of at release time.
      - name: poetry.lock matches pyproject.toml
        run: tools-venv/bin/poetry check --lock

      # Ruff from poetry.lock's dev group: the version the tests' ruff
      # ratchet counts with.
      - name: Ruff (poetry.lock)
        env:
          POETRY_VIRTUALENVS_CREATE: "false"
        run: |
          python3 -m venv lint-venv
          VIRTUAL_ENV="$PWD/lint-venv" tools-venv/bin/poetry install \
            --only dev --no-root --no-interaction

      - name: Python (pyflakes, bugbear and simplify rules)
        run: lint-venv/bin/ruff check src/tuxtalk tests

      # Only tracked scripts, so DEV_SETUP.md's copy of this command gives the
      # same answer in a working folder that holds untracked scripts too.
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 tools-venv/bin/shellcheck -S warning
